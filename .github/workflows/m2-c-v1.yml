name: M2 C-v1 network acceptance
"on":
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: m2-c-v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  c-v1-network:
    name: Real C API and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        env:
          POSTGRES_DB: campus_m2_live
          POSTGRES_USER: campus_m2_live
          POSTGRES_PASSWORD: synthetic-c-v1-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus_m2_live -d campus_m2_live"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      CAMPUS_DB_HOST: 127.0.0.1
      CAMPUS_DB_PORT: 5432
      CAMPUS_DB_NAME: campus_m2_live
      CAMPUS_DB_USER: campus_m2_live
      CAMPUS_DB_PASSWORD: synthetic-c-v1-only-password
      CAMPUS_BOOTSTRAP_PASSWORD: synthetic-c-v1-account-password
      CAMPUS_M2_CONTRACT_SERVER: ${{ github.workspace }}/.contract/c-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out C-v1 with room identity, principal snapshot fix and merged M1 migrations
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 51b65bfedd87c85cd9295fdeb01b92e9460e7c5c
          path: .contract/c-server
          persist-credentials: false
      - name: Check out published B ordinary directory and audit ports
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4ee2fe5b2b221d7b5e24cd7f94ede1022a8353f3
          path: .contract/b-server
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r .contract/c-server/backend/requirements-dev.txt
      - run: npm ci --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - name: Prepare byte-verified C and B source workspace
        run: python .contract/c-server/backend/tests/c_module/prepare_resource_acceptance.py --source "$GITHUB_WORKSPACE/.contract/b-server" --output "$RUNNER_TEMP/m2-cb"
      - run: bash infra/scripts/ci-m2-c-v1.sh
        env:
          CAMPUS_M2_CONTRACT_SERVER: ${{ runner.temp }}/m2-cb
      - name: Save synthetic browser acceptance screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m2-room-options-browser
          path: frontend/test-results/*-m2-real-room-options.png
          if-no-files-found: ignore
          retention-days: 7
