name: C M3 identity and transaction audit acceptance

"on":
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m3-acceptance:
    name: Fixed E tickets with C Bearer and PostgreSQL audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        env:
          POSTGRES_DB: campus_m3_acceptance
          POSTGRES_USER: campus_ci
          POSTGRES_PASSWORD: synthetic-m3-acceptance-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus_ci -d campus_m3_acceptance"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      CAMPUS_DB_HOST: 127.0.0.1
      CAMPUS_DB_PORT: 5432
      CAMPUS_DB_NAME: campus_m3_acceptance
      CAMPUS_DB_USER: campus_ci
      CAMPUS_DB_PASSWORD: synthetic-m3-acceptance-password
      CAMPUS_C_ENABLED: 'false'
      CAMPUS_TEST_POSTGRES: '1'
      CAMPUS_REQUIRE_M3_ACCEPTANCE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read fixed E ticket and precommit audit ports
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ElastingYun/campus_resource_management
          ref: d310c5610ae66341a767244e000d8babb1142b08
          path: .c71-e-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Prepare exact E sources without changing the product migration graph
        run: >-
          python backend/tests/c_module/prepare_m3_acceptance.py
          --source "$GITHUB_WORKSPACE/.c71-e-source"
          --output "$RUNNER_TEMP/c71-combined"
      - name: Check combined code and actual C E runtime transactions
        working-directory: ${{ runner.temp }}/c71-combined/backend
        run: |
          ruff check .
          ruff format --check .
          python -m pytest -q tests/c_module/test_m3_identity.py tests/c_module/test_identity.py tests/c_module/test_login_concurrency.py tests/c_module/test_principal_snapshot.py
