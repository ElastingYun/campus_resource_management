name: C resource identity and audit acceptance

"on":
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resource-acceptance:
    name: Pinned B v2 with C identity and PostgreSQL audit
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        env:
          POSTGRES_DB: campus_resource_acceptance
          POSTGRES_USER: campus_ci
          POSTGRES_PASSWORD: synthetic-resource-acceptance-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus_ci -d campus_resource_acceptance"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      CAMPUS_DB_HOST: 127.0.0.1
      CAMPUS_DB_PORT: 5432
      CAMPUS_DB_NAME: campus_resource_acceptance
      CAMPUS_DB_USER: campus_ci
      CAMPUS_DB_PASSWORD: synthetic-resource-acceptance-password
      CAMPUS_C_ENABLED: 'false'
      CAMPUS_TEST_POSTGRES: '1'
      CAMPUS_REQUIRE_RESOURCE_ACCEPTANCE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read the exact B audit v2 dependency without merging it
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ElastingYun/campus_resource_management
          ref: 4ee2fe5b2b221d7b5e24cd7f94ede1022a8353f3
          path: .c24-b-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify source bytes and prepare disposable combined workspace
        run: >-
          python backend/tests/c_module/prepare_resource_acceptance.py
          --source "$GITHUB_WORKSPACE/.c24-b-source"
          --output "$RUNNER_TEMP/c24-combined"
      - name: Check combined sources and migrate isolated PostgreSQL
        working-directory: ${{ runner.temp }}/c24-combined/backend
        run: |
          ruff check .
          ruff format --check .
          alembic upgrade head
          alembic upgrade head
      - name: Verify C and B regressions, real transaction rollback and TCP login flow
        working-directory: ${{ runner.temp }}/c24-combined/backend
        run: python -m pytest -q
