name: Engineering CI

"on":
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend checks and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        env:
          POSTGRES_DB: campus_ci
          POSTGRES_USER: campus_ci
          POSTGRES_PASSWORD: synthetic-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus_ci -d campus_ci"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      CAMPUS_DB_HOST: 127.0.0.1
      CAMPUS_DB_PORT: 5432
      CAMPUS_DB_NAME: campus_ci
      CAMPUS_DB_USER: campus_ci
      CAMPUS_DB_PASSWORD: synthetic-ci-only-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -m 'not integration'
      - name: Apply migration to empty PostgreSQL and repeat
        run: |
          alembic upgrade head
          alembic upgrade head
      - name: Verify real PostgreSQL readiness and migration head
        env:
          CAMPUS_TEST_POSTGRES: '1'
        run: python -m pytest -m integration

  compose-smoke:
    name: Compose build and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CAMPUS_DB_NAME: campus_smoke
      CAMPUS_DB_USER: campus_smoke
      CAMPUS_DB_PASSWORD: synthetic-compose-ci-only-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build, migrate, probe, interrupt and recover database
        run: bash infra/scripts/ci-smoke.sh
