name: B shared resource host acceptance

"on":
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resource-host:
    name: Current C-B host with desktop and mobile browsers
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        env:
          POSTGRES_DB: campus_b_host_acceptance
          POSTGRES_USER: campus_ci
          POSTGRES_PASSWORD: synthetic-b-host-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus_ci -d campus_b_host_acceptance"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      CAMPUS_DB_HOST: 127.0.0.1
      CAMPUS_DB_PORT: 5432
      CAMPUS_DB_NAME: campus_b_host_acceptance
      CAMPUS_DB_USER: campus_ci
      CAMPUS_DB_PASSWORD: synthetic-b-host-ci-password
      CAMPUS_C_ENABLED: 'false'
      B_RESOURCE_HOST_ACCEPTANCE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm ci --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - name: Check Node-only B browser configuration
        working-directory: frontend
        run: npx tsc --noEmit --types node --module ESNext --moduleResolution Bundler --target ES2022 --skipLibCheck src/modules/m1-reservation/resources/browser/playwright.config.mts
      - name: Migrate fresh child DB twice and test the current shared App and actual C-B host
        run: python backend/tests/resources/run_shared_host_acceptance.py
      - name: Save synthetic browser result screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b-shared-resource-browser
          path: frontend/test-results/b-resource-host/**/host-*.png
          if-no-files-found: ignore
          retention-days: 7
