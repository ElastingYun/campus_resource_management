server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    location /health/ {
        proxy_pass http://backend:8000;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
